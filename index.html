<h1>Household Agent</h1>
<p>A private assistant used only by the members of one household to work with their own Google account (Gmail, Drive, Docs, Sheets, Calendar).</p>
<p>It is not offered to the public and has no other users. See the <a href="privacy.html">privacy policy</a>.</p>
